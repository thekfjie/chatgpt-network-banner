plugins {
    id "com.android.application"
}

android {
    namespace "com.kfjie.chatgptnetworkbanner"
    compileSdk 35

    defaultConfig {
        applicationId "com.kfjie.chatgptnetworkbanner"
        minSdk 32
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}
